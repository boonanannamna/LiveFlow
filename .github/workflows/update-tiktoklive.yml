name: Update TikTokLive connector

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install upstream connector
        run: python -m pip install -r connector/requirements.txt
      - name: Compile connector
        run: python -m py_compile connector/tiktok_connector.py
      - name: Open update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update TikTokLive connector"
          title: "chore: update TikTokLive connector"
          body: "Automated weekly check against the upstream TikTokLive GitHub repository."
          branch: automation/update-tiktoklive

